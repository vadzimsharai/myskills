<!doctype html>
<html lang="en">
<head>

<title>Discussion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<script>
  // Theme before first paint, so a stored choice never flashes the other palette.
  try { const t = localStorage.getItem('dq:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
/* Layout: navigation rail + wide reading area; an open item splits into text (left) and a sticky answer panel (right) */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f1f3f6; --line:rgba(20,28,48,.09); --line-strong:rgba(20,28,48,.16);
  --fg:#15171c; --muted:#5a6170; --faint:#6b7280;
  --accent:#3f5ae0; --accent-2:#6a45f0; --accent-ink:#ffffff; --accent-soft:rgba(63,90,224,.10);
  --wait:#b86e00; --sent:#6a45f0; --added:#c0267e; --work:#0a72c2; --done:#16804a; --err:#c62f2f;
  --shadow-cta:0 4px 14px rgba(63,90,224,.25); --ring:0 0 0 3px rgba(63,90,224,.16);
  --user-bubble:#e4f4ea; --user-line:rgba(22,128,74,.22); --ai-bubble:rgba(10,132,110,.06); --ai-line:rgba(10,132,110,.30); --ai-name:#0a846e; --user-name:#16804a;
  --gradient:linear-gradient(180deg,var(--accent),var(--accent-2));
  --accent-gradient:linear-gradient(135deg,#6e8bff,#7c5cff 55%,#4ad9c0);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0e; --surface:#15171b; --sunk:#1b1e24; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --fg:#e8eaf0; --muted:#9aa1ac; --faint:#6b7280;
  --accent:#6e8bff; --accent-2:#7c5cff; --accent-ink:#ffffff; --accent-soft:rgba(110,139,255,.12);
  --wait:#f5a623; --sent:#a78bfa; --added:#f472b6; --work:#4cb0ff; --done:#34c77b; --err:#ff5a5a;
  --shadow-cta:0 4px 14px rgba(110,139,255,.28); --ring:0 0 0 3px rgba(110,139,255,.16);
  --user-bubble:rgba(52,199,123,.16); --user-line:rgba(52,199,123,.35); --ai-bubble:rgba(74,217,192,.07); --ai-line:rgba(74,217,192,.32); --ai-name:#4ad9c0; --user-name:#34c77b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --surface:#15171b; --sunk:#1b1e24; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --fg:#e8eaf0; --muted:#9aa1ac; --faint:#6b7280;
  --accent:#6e8bff; --accent-2:#7c5cff; --accent-ink:#ffffff; --accent-soft:rgba(110,139,255,.12);
  --wait:#f5a623; --sent:#a78bfa; --added:#f472b6; --work:#4cb0ff; --done:#34c77b; --err:#ff5a5a;
  --shadow-cta:0 4px 14px rgba(110,139,255,.28); --ring:0 0 0 3px rgba(110,139,255,.16);
  --user-bubble:rgba(52,199,123,.16); --user-line:rgba(52,199,123,.35); --ai-bubble:rgba(74,217,192,.07); --ai-line:rgba(74,217,192,.32); --ai-name:#4ad9c0; --user-name:#34c77b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
/* Nothing may widen the page sideways (Safari keeps a zoomed-out scale after a single wide frame); clip keeps sticky working, unlike hidden. */
html{overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
/* While a dialog or the item drawer is open, the page underneath does not scroll. */
html:has(dialog[open]),html:has(.rail.open){overflow:hidden}
.vbody,.cside-list,.cside-full,.rail,dialog{overscroll-behavior:contain}
body{background:var(--bg);color:var(--fg);font:15.5px/1.65 var(--f-body);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
code{font:.86em var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
pre{background:var(--sunk);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:12px 0}
pre code,pre code.hljs{background:transparent;padding:0;font-size:.84em}
table{border-collapse:collapse;font-size:.92em;display:block;overflow-x:auto;margin:12px 0}
th,td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted)}
img{max-width:100%;border-radius:6px}
blockquote{margin:10px 0;padding:2px 14px;border-left:2px solid var(--line-strong);color:var(--muted)}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 1.05em}
.md ul,.md ol{margin:0 0 1.05em;padding-left:1.3em}
.md li{margin:.25em 0}
.md strong{font-weight:600}
.md{overflow-wrap:break-word}

/* shell */
/* Centred and capped: the reading column stays around 1050px on wide screens. */
.shell{position:relative;display:grid;grid-template-columns:var(--rail-w,320px) minmax(0,1fr);gap:56px;padding-inline:32px;padding-block:40px 140px;max-width:1440px;margin-inline:auto}
@media (max-width:700px){
  .progress{gap:2px 14px;line-height:1.5}
  .progress .bar{flex-basis:100%;order:-1}
}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:0;padding-inline:16px;padding-block:24px 120px}
  details.item>summary{padding:14px 16px}
  .ibody{margin:0 16px}}

/* rail */
.rail{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:6px;font-size:.9rem;scrollbar-width:thin}
.rail .g{margin:0 0 22px}
.rail .gh{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.02em;margin:0 0 4px;padding:0 8px}
.rail .gh span:last-child{font-variant-numeric:tabular-nums;font-weight:500;color:var(--faint)}
.rail a{display:grid;grid-template-columns:12px minmax(3.1em,max-content) minmax(0,1fr);align-items:baseline;gap:4px 6px;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--fg)}
.rail a:hover{background:var(--sunk)}
.rail a.cur{background:var(--accent-soft)}
.rail a.sub{padding-left:22px}
.rail .rid{font:500 .78rem var(--f-mono);color:var(--muted)}
.rail .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail a.s-closed .rt{color:var(--faint)}
.mark{font-size:.7rem;line-height:1;text-align:center}
.mark.s-needs-you::before{content:"●";color:var(--wait)}
.mark.s-in-progress::before{content:"●";color:var(--work)}
.mark.s-sent::before{content:"●";color:var(--sent)}
.mark.s-added::before{content:"●";color:var(--added)}
.mark.s-closed::before{content:"✓";color:var(--done)}
@media (max-width:960px){
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);height:100vh;height:100dvh;max-height:none;overflow-y:auto;z-index:20;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .2s}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)}
}

/* header */
header.top{margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--line);position:relative}
header.top::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;border-radius:2px;background:var(--accent-gradient)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
header.top h1{font-size:1.7rem;line-height:1.2;font-weight:650;margin:0 0 6px;text-wrap:balance}
.sub-t{color:var(--muted);margin:0 0 20px}
.progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.bar{flex:0 1 220px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-gradient);border-radius:3px}
.progress b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg .fc{font-variant-numeric:tabular-nums;opacity:.7}
.seg button{white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1 1 220px;min-width:0;max-width:420px;border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;padding:6px 12px;font:inherit;font-size:.9rem;color:var(--fg)}
.icon-btn{border:1px solid var(--line-strong);background:var(--sunk);border-radius:10px;padding:5px 12px;font-weight:500;cursor:pointer;font-size:.88rem;color:var(--muted);white-space:nowrap}
.icon-btn:hover{color:var(--fg);border-color:var(--line-strong)}
.navbtn{display:none}
.toolbar .searchbtn{display:none}
@media (max-width:960px){.navbtn{display:inline-block}}
.spacer{flex:1}

.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:12px 0;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.ctx{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 20px;margin:0 0 12px}
details.ctx>summary{cursor:pointer;color:var(--muted);font-size:.92rem}
details.ctx[open]>summary{margin-bottom:10px}

/* groups & items */
section.group{margin:56px 0 0;padding-top:32px;border-top:1px solid var(--line)}
section.group:first-child{border-top:0;padding-top:0;margin-top:32px}
section.group>h2{font-size:1.15rem;font-weight:650;margin:0 0 6px;display:flex;gap:10px;align-items:baseline}
section.group>h2 .gid{font:500 .9rem var(--f-mono);color:var(--muted)}
section.group>h2 .gcount{margin-left:auto;font-size:.8rem;font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
.gintro{color:var(--muted);margin:6px 0 4px;font-size:.94rem}
.items{display:flex;flex-direction:column;gap:12px;margin-top:20px}

details.item{scroll-margin-top:clamp(56px,14vh,140px)}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s}
details.item[open]{border-color:var(--line-strong)}
/* The coloured left border carries the status, so the card needs no dot. */
details.item>summary>.mark{display:none}
details.item>summary{list-style:none;cursor:pointer;padding:14px 22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-radius:var(--r)}
details.item[open]>summary{padding-block:12px}
details.item[open]>summary .ttl{font-weight:650;font-size:1.02rem}
@media (max-width:700px){details.item>summary,details.item[open]>summary{padding:10px 14px}}
details.item>summary:hover{background:var(--sunk)}
details.item>summary::-webkit-details-marker{display:none}
.iid{font:600 .76rem var(--f-mono);color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:1px 7px;min-width:2.8em;text-align:center}
.ttl{font-weight:550;min-width:0;letter-spacing:-.005em}
details.item.s-closed .ttl{color:var(--muted)}
.state{font-size:.8rem;color:var(--faint);white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.state .n{color:var(--accent);font-weight:500}
.state .w,.state .y,.state .a,.state .p,.state .d{--c:currentColor;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:1px 8px;border-radius:999px;font-weight:600}
.state .w{--c:var(--wait)} .state .y{--c:var(--sent)} .state .a{--c:var(--added)} .state .p{--c:var(--work)} .state .d{--c:var(--done);font-weight:500}
/* A status stripe on the card edge, so states differ at a glance, not only by a small dot. */
details.item{border-left-width:4px}
details.item.v-needs-you{border-left-color:var(--wait)} details.item.v-sent{border-left-color:var(--sent)} details.item.v-added{border-left-color:var(--added)}
details.item.v-in-progress{border-left-color:var(--work)} details.item.v-closed{border-left-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.preview{grid-column:2 / -1;font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item[open] .preview{display:none}
.tag{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 7px}

/* Chat-like: the description and the chat take the full card width, the answer box sits under them like a composer. */
.ibody{margin:0 22px;padding:20px 0 26px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.col-text{min-width:0}
.resolution{font-size:.94rem;margin:0 0 18px;padding:8px 12px;border-radius:8px;background:var(--accent-soft)}
.resolution b{font-weight:600}
.action{font-size:.88rem;color:var(--work);margin:0 0 12px}
details.more{margin:22px 0 0}
.tolast{margin-top:16px}
.more-inline{margin:18px 0 0;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px;font-size:.94rem;color:var(--muted)}
.more-inline .ml{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:.9rem;list-style:none}
details.more>summary::before{content:"＋ "}
details.more[open]>summary::before{content:"− "}
details.more>.md{margin-top:14px;padding-top:16px;border-top:1px dashed var(--line)}

/* The item's history reads as a chat: the reader on the right in green, the AI on the left in teal. */
.thread{margin:28px 0 0;padding-top:20px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.msg{align-self:flex-start;max-width:min(94%,960px);min-width:0;padding:8px 14px 10px;border:1px solid var(--ai-line);border-radius:17px 17px 17px 5px;background:var(--ai-bubble)}
.msg.user{align-self:flex-end;border-color:var(--user-line);border-radius:17px 17px 5px 17px;background:var(--user-bubble)}
.msg .who{font-size:.8rem;color:var(--faint);margin:-2px -4px 6px 0;min-height:30px}
.msg .who b{font-weight:600}
.msg.ai .who b{color:var(--ai-name)} .msg.user .who b{color:var(--user-name)}
.msg.pending{border-style:dashed;opacity:.85}
.msg.ask{border-color:var(--accent);box-shadow:var(--ring)}
.msg .asktag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.7rem}
.older{border:0;background:none;padding:0;color:var(--muted);font-size:.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:center}
/* System lines: status changes and earlier versions of the description sit centred, outside the bubbles. */
.msg.ev,.msg.q{align-self:center;max-width:90%;border:0;background:none;box-shadow:none;padding:2px 0;text-align:center;font-size:.8rem;color:var(--faint)}
.msg.ev .who{display:inline;margin:0}
.msg.q>summary{cursor:pointer;list-style:none}
.msg.q>summary::-webkit-details-marker{display:none}
.msg.q>summary::before{content:'▸ '}
.msg.q[open]>summary::before{content:'▾ '}
.msg .md{font-size:.95rem}
.msg .md h1,.msg .md h2,.msg .md h3,.viewer .md h1,.viewer .md h2,.viewer .md h3{font-weight:650;letter-spacing:-.01em;line-height:1.3;margin:1.1em 0 .5em}
.msg .md h1,.msg .md h2{font-size:1.08rem} .msg .md h3{font-size:1rem}
.msg .md table{font-size:.86em}
.msg .md pre{background:color-mix(in srgb,var(--bg) 70%,transparent)}
/* A long message is clamped in the chat; the full version opens in the viewer. */
.msg.long>.md{max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.msg .who{display:flex;align-items:center;gap:0 8px;flex-wrap:wrap}
.msg .who b{font-size:.86rem}
.msg .who .ibtn{margin-left:auto}
.msg:not(.big) .vbtn{display:none}
.msg .more-btn{display:none;margin-top:6px;border:0;background:none;padding:0;color:var(--accent);font-size:.84rem;font-weight:500;cursor:pointer}
.msg.long .more-btn,.msg.expanded .more-btn{display:inline-block}
.body-head{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:-4px 0 6px}
.body-head .iacts{display:flex;gap:6px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
/* GitHub-style callouts: > [!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION]. */
.callout{margin:12px 0;padding:10px 14px;border:1px solid var(--c-line);border-left:3px solid var(--c);border-radius:10px;background:var(--c-soft)}
.callout>.ct{display:block;font-size:.74rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.callout>:last-child{margin-bottom:0}
.callout.note{--c:var(--accent)} .callout.tip{--c:var(--done)} .callout.important{--c:var(--sent)} .callout.warning{--c:var(--wait)} .callout.caution{--c:var(--err)}
.callout{--c-line:color-mix(in srgb,var(--c) 30%,transparent);--c-soft:color-mix(in srgb,var(--c) 8%,transparent)}
/* Full-screen viewer for a message or an item description. */
dialog.viewer{width:min(1320px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid var(--line-strong);border-radius:18px;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog.qrbox{width:min(420px,calc(100vw - 32px))}
dialog.qrbox .vbody{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px}
.qr{background:#fff;padding:14px;border-radius:14px;line-height:0}
.qr svg{width:min(300px,70vw);height:auto;display:block}
.qrurl{font:500 .78rem var(--f-mono);color:var(--muted);word-break:break-all;text-align:center}
dialog.composer .vbody{display:flex;flex-direction:column;gap:12px}
/* Desktop: the item's chat in a side panel next to the big answer box; a message opens over the whole panel. */
dialog.composer{width:min(1320px,calc(100vw - 32px))}
@media (min-width:961px){
  dialog.composer[open]{height:min(880px,calc(100vh - 48px));display:flex;flex-direction:column}
  dialog.composer .cgrid{flex:1;min-height:0}
  dialog.composer .cside{max-height:none;min-height:0}
  dialog.composer .cmain{max-height:none;min-height:0;overflow:hidden}
  dialog.composer #ctext{flex:1;min-height:0;resize:none}
}
.cmain .chips{flex:0 0 auto;align-items:flex-start}
.cgrid{display:grid;grid-template-columns:var(--side-w,360px) minmax(0,1fr);min-height:0}
dialog.composer.noside .cgrid{grid-template-columns:minmax(0,1fr)}
dialog.composer.noside .cside{display:none}
.side-grip{position:absolute;top:0;bottom:0;right:-6px;width:12px;cursor:col-resize;z-index:2}
.side-grip::after{content:"";position:absolute;top:0;bottom:0;left:5px;width:2px;background:transparent;transition:background .15s}
.side-grip:hover::after,.side-grip.drag::after{background:var(--accent)}
.cside{position:relative;border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;max-height:calc(100vh - 110px);min-height:0}
.cside-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.86rem}
.cside-head b{font-weight:650}
.cside-list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.cmsg{display:block;width:100%;text-align:left;cursor:pointer;border:1px solid var(--ai-line);background:var(--ai-bubble);border-radius:12px 12px 12px 4px;padding:7px 10px;color:var(--fg);font:inherit}
.cmsg.user{border-color:var(--user-line);background:var(--user-bubble);border-radius:12px 12px 4px 12px;margin-left:24px;width:calc(100% - 24px)}
.cmsg.desc{border-style:dashed;border-color:var(--line-strong);background:var(--surface)}
.cmsg.ask{border-color:var(--accent)}
.cmsg:hover{border-color:var(--accent)}
.cmsg .cw{display:block;font-size:.72rem;color:var(--faint);margin-bottom:2px}

  dialog.composer .chips{flex-wrap:nowrap;overflow-x:auto}

  .item-form{padding:12px 14px}

  /* Edge to edge: cards touch the screen sides; loose text keeps a small inner gutter. */
  .shell{padding-inline:0}
  header.top,section.group>h2,.gintro,.note,#sentnote,section.group.phantom>h2{padding-inline:14px}
  header.top::after{left:14px}

  details.item[open] .col-answer{border-radius:0}
  section.group{border-top:0}
  .pill-bar{top:calc(10px + env(safe-area-inset-top,0px))}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(() => {
  const STATUS = { 'needs-you': 'needs you', 'sent': 'you answered', 'added': 'you added — not read yet', 'in-progress': 'AI is on it', 'closed': 'settled' };
  const STATE_CLASS = { 'needs-you': 'w', 'sent': 'y', 'added': 'a', 'in-progress': 'p', 'closed': 'd' };
  // An answer sent from the page but not yet read by the AI shows as its own state.
  const shown = it => { const st = it.status || 'needs-you'; return it.unread ? 'added' : st !== 'closed' && pendingFor(it.id).length ? 'sent' : st; };
  // "Fresh" = the AI wrote into an item since this browser last opened it; the dot pulses until then.
  const byId = new Map();
  const aiCount = it => (it.thread || []).filter(m => m.who === 'ai' && m.kind !== 'question').length;
  const seenKey = id => 'seen:' + id;
  const isFresh = it => { if (it.unread || (it.author === 'user' && !aiCount(it))) return false; const v = store.get(seenKey(it.id)); return v === '' ? !!store.get('init') : aiCount(it) > Number(v); };
  const isNewItem = it => !!it.round && it.round === state.round && state.round > 1;
  function markSeen(id) {
    const it = byId.get(id);
    if (!it || !isFresh(it)) return false;
    store.set(seenKey(id), String(aiCount(it)));
    document.querySelectorAll(`[data-fresh="${CSS.escape(id)}"]`).forEach(n => { n.classList.remove('fresh'); if (n.classList.contains('n')) n.remove(); });
    return true;
  }
  function freshIds() { const out = []; byId.forEach((it, id) => { if (isFresh(it)) out.push(id); }); return out; }
  // Stock answers become the reader's own message, so they follow the content's language, not the interface's.
  const QUICK_BY_LANG = {
    en: ['Agreed', 'Disagree, because ', 'Explain in more detail', 'OK to close'],
    ru: ['Согласен', 'Не согласен, потому что ', 'Объясни подробнее', 'Можно закрывать'],
  };
  const contentLang = () => state?.lang || (/[А-Яа-яЁё]/.test((state?.title || '') + (state?.subtitle || '')) ? 'ru' : 'en');
  const quickReplies = () => QUICK_BY_LANG[contentLang()] || QUICK_BY_LANG.en;
  const ICONS = {
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    doc: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
    min: '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" x2="21" y1="10" y2="3"/><line x1="3" x2="10" y1="21" y2="14"/>',
    panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    qr: '<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
    send: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    reopen: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    sub: '<polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    max: '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>',
    down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
    expand: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
    collapse: '<path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    system: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    dark: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  };
  const ico = name => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
  const THEMES = ['system', 'light', 'dark'];
  const THEME_LABEL = { system: 'Theme: system', light: 'Theme: light', dark: 'Theme: dark' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    key: id => 'dq:' + location.pathname + ':' + id,
    get(id) { try { return localStorage.getItem(this.key(id)) || ''; } catch { return ''; } },
    set(id, v) { try { v ? localStorage.setItem(this.key(id), v) : localStorage.removeItem(this.key(id)); } catch {} },
  };

  // `raw` is state.json as published; `state` is what the page shows: raw plus page actions the AI has not read yet.
  let raw = null, state = null, pending = [], filter = 'open', query = '';
  // The add-item form that is open now: {kind:'group'|'parent'|'phantom', target, title, text}; survives live re-renders.
  let form = null;
  try { form = JSON.parse(store.get('form') || 'null'); } catch {}
  const saveForm = () => store.set('form', form ? JSON.stringify(form) : '');
  // Items the reader is working in stay on screen and keep their answer box even if the AI closes them meanwhile.
  const pinned = new Set();
  const THREAD_TAIL = 5;
  const fullThreads = new Set();

  // ---------- theme
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function currentTheme() { return document.documentElement.dataset.theme || 'system'; }
  function applyTheme(t) {
    if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    try { t === 'system' ? localStorage.removeItem('dq:theme') : localStorage.setItem('dq:theme', t); } catch {}
    $('theme').innerHTML = ico(t); $('theme').title = THEME_LABEL[t];
    syncHighlightTheme();
    redrawDiagrams();
  }
  function syncHighlightTheme() {
    const d = isDark();
    $('hl-light').disabled = d; $('hl-dark').disabled = !d;
    mermaid.initialize({ startOnLoad: false, theme: d ? 'dark' : 'neutral', securityLevel: 'strict',
      fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif', flowchart: { htmlLabels: false } });
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (currentTheme() === 'system') { syncHighlightTheme(); redrawDiagrams(); } });

  // ---------- markdown & diagrams
  // Tables inside collapsed <details> have no width, so they can only be measured once opened.
  // A message earns the full-screen button when it renders taller than three lines or holds more than paragraphs.
  function markBig() {
    document.querySelectorAll('details.item[open] .msg[data-msg]:not(.sized)').forEach(m => {
      const box = m.querySelector(':scope > .md');
      if (!box || !box.offsetHeight) return;
      m.classList.add('sized');
      const line = parseFloat(getComputedStyle(box).lineHeight) || 22;
      const rich = box.querySelector('table, pre, .mermaid, img, .callout, h1, h2, h3, h4');
      m.classList.toggle('big', !!rich || box.scrollHeight > line * 3.4);
    });
  }
  function markLong() {
    markBig();
    document.querySelectorAll('details.item[open] .msg[data-msg]:not(.measured):not(.expanded)').forEach(m => {
      const box = m.querySelector(':scope > .md');
      if (!box || !box.offsetHeight) return;
      m.classList.add('measured');
      // The newest message is the one being read: it is never clamped.
      const newest = [...m.parentElement.querySelectorAll(':scope > .msg[data-msg]')].pop() === m;
      m.classList.toggle('long', !newest && box.scrollHeight > 380);
    });
  }
  function fitTables() {
    markLong();
    document.querySelectorAll('details.item[open] > .ibody:not(.wide)').forEach(b => {
      if ([...b.querySelectorAll(':scope > .col-text table')].some(t => t.scrollWidth > t.clientWidth)) b.classList.add('wide');
    });
  }
  function md(text) {
    if (!text) return '';
    const box = document.createElement('div');
    box.innerHTML = DOMPurify.sanitize(marked.parse(String(text), { gfm: true, breaks: true }));
    box.querySelectorAll('pre code.language-mermaid').forEach(code => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.dataset.src = code.textContent;
      code.parentElement.replaceWith(div);
    });
    const CALLOUT = { NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important', WARNING: 'Warning', CAUTION: 'Caution' };
    box.querySelectorAll('blockquote').forEach(q => {
      const first = q.querySelector(':scope > p');
      const m = first?.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br>)?\s*/i);
      if (!m) return;
      first.innerHTML = first.innerHTML.slice(m[0].length);
      if (!first.innerHTML.trim()) first.remove();
      const div = document.createElement('div');
      div.className = 'callout ' + m[1].toLowerCase();
      div.innerHTML = `<span class="ct">${CALLOUT[m[1].toUpperCase()]}</span>` + q.innerHTML;
      q.replaceWith(div);
    });
    box.querySelectorAll('td code, th code').forEach(code => { code.innerHTML = esc(code.textContent).replace(/([/.,{_|])(?=\S)/g, '$1<wbr>'); });
    linkItemIds(box);
    return box.innerHTML;
  }
  // «see B3.8» in any text becomes a link that opens and scrolls to that item; code and existing links stay as they are.
  const ITEM_REF = /\b[A-Z][0-9]+(?:\.[0-9]+)*\b/g;
  function linkItemIds(box) {
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('code, pre, a, .mermaid') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const text = n.nodeValue;
      if (!ITEM_REF.test(text)) return;
      ITEM_REF.lastIndex = 0;
      const html = esc(text).replace(ITEM_REF, id => byId.has(id) ? `<a class="iref" href="#i-${id}" data-jump="${id}">${id}</a>` : id);
      const span = document.createElement('span'); span.innerHTML = html; n.replaceWith(...span.childNodes);
    });
  }
  // mermaid.render lays a diagram out off-screen, so diagrams inside collapsed <details> come out
  // right; one at a time, or concurrent layouts measure each other.
  let diagramSeq = 0;
  function drawDiagrams() {
    const nodes = [...document.querySelectorAll('.mermaid:not([data-queued])')];
    nodes.forEach(n => { n.dataset.queued = '1'; });
    drawDiagrams.chain = (drawDiagrams.chain || document.fonts.ready).then(async () => {
      for (const n of nodes) {
        try { n.innerHTML = (await mermaid.render('dq-diagram-' + (++diagramSeq), n.dataset.src)).svg; }
        catch { n.innerHTML = '<pre><code>' + esc(n.dataset.src) + '</code></pre>'; }
      }
    });
  }
  function redrawDiagrams() {
    document.querySelectorAll('.mermaid').forEach(n => { delete n.dataset.queued; n.innerHTML = ''; });
    drawDiagrams();
  }

  // ---------- data helpers
  function walk(items, fn, depth = 0) { (items || []).forEach(it => { fn(it, depth); walk(it.children, fn, depth + 1); }); }
  function flatItems(items) { const out = []; const go = (list, parentId) => (list || []).forEach(it => { out.push([it, parentId]); go(it.children, it.id); }); go(items, ''); return out; }
  function everyItem(fn) { (state.groups || []).forEach(g => walk(g.items, fn)); }
  function pendingFor(id) { return pending.filter(p => !p.data?.type && (p.data?.item || '_general') === id); }
  function withPending(base) {
    const view = structuredClone(base);
    view.groups = view.groups || [];
    const find = id => { let hit = null; view.groups.forEach(g => walk(g.items, it => { if (it.id === id) hit = it; })); return hit; };
    let added = 0;
    pending.filter(p => p.data?.type).forEach(p => {
      const d = p.data;
      if (d.type === 'new') {
        const it = d.title ? { id: '+' + (++added), title: d.title, body: d.text || '', status: 'in-progress', unread: true, thread: [] }
          : { id: '+' + (++added), title: firstLine(d.text), body: '', status: 'in-progress', unread: true, thread: [{ who: 'user', round: base.round, at: p.at, text: d.text }] };
        const parent = d.parent && find(d.parent);
        if (parent) { (parent.children = parent.children || []).push(it); return; }
        let g = d.newGroup ? null : view.groups.find(x => x.id === d.group) || view.groups.find(x => x.own);
        if (d.newGroup) { g = d.newGroup === true ? null : view.groups.find(x => x.pseudo && x.title === d.newGroup); if (!g) { g = { id: '+' + (++added), title: d.newGroup === true ? 'New section — the AI will name it' : d.newGroup, pseudo: true, items: [] }; view.groups.push(g); } }
        if (!g) { g = { id: '+', title: 'Your items', own: true, pseudo: true, items: [] }; view.groups.push(g); }
        (g.items = g.items || []).push(it);
      } else {
        const it = find(d.item);
        if (!it) return;
        it.status = d.type === 'delete' ? 'deleted' : d.status === 'needs-you' ? 'in-progress' : d.status;
        if (d.status === 'closed') it.resolution = d.text || it.resolution || 'Closed by you';
      }
    });
    const prune = items => (items || []).filter(it => it.status !== 'deleted').map(it => ({ ...it, children: prune(it.children) }));
    view.groups = view.groups.map(g => ({ ...g, items: prune(g.items) }));
    return view;
  }
  function firstLine(text) { const t = plain(text).split(/(?<=[.!?])\s/)[0] || 'New item'; return t.length > 70 ? t.slice(0, 67) + '…' : t; }
  function refreshView() { state = withPending(raw); }
  function fmtTime(at) {
    const d = new Date(at);
    return at && !isNaN(d) ? d.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  }

  // ---------- render

  }

    else if (b.id === 'theme') applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
    else if (b.id === 'expand') {
      const all = [...document.querySelectorAll('details.item:not(.hidden-by-filter)')];
      const openAll = all.some(d => !d.open);
      expandingAll = true; all.forEach(d => { d.open = openAll; }); setTimeout(() => { expandingAll = false; }, 0);
      b.innerHTML = ico(openAll ? 'collapse' : 'expand'); b.title = b.ariaLabel = openAll ? 'Collapse all' : 'Expand all';
      markCurrent();
    }
  });

  $('theme').innerHTML = ico(currentTheme()); $('theme').title = THEME_LABEL[currentTheme()];
  $('expand').innerHTML = ico('expand'); $('vclose').innerHTML = ico('x'); $('totop').innerHTML = ico('send'); $('qrbtn').innerHTML = ico('qr'); $('searchbtn').innerHTML = ico('search'); $('qrclose').innerHTML = ico('x'); $('cclose').innerHTML = ico('collapse'); $('csidebtn').innerHTML = ico('panel'); $('vsidebtn').innerHTML = ico('panel'); $('vexpand').innerHTML = ico('max'); $('vsend').innerHTML = ico('send'); $('cmsgview').innerHTML = ico('doc'); $('vmodebtn').innerHTML = ico('pen'); syncMaxButtons();
  syncHighlightTheme();
  load().catch(err => { $('title').textContent = 'The page failed to load'; $('subtitle').textContent = String(err?.message || err); console.error(err); });
  setInterval(poll, 6000);
})();
</script>
