<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style nonce="{{.Nonce}}">
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e6e6e6; --card: #ffffff;
    --accent: #2457c5; --accent-fg: #ffffff; --danger: #c0392b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --fg: #e8e8e8; --muted: #9a9fa6; --line: #262a30; --card: #16191d; --accent: #7aa2ff; --accent-fg: #0b1020; --danger: #ff7b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
  form { width: min(360px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: grid; gap: 14px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input { font: 15px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { font: 500 14px var(--sans); color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; margin-top: 4px; }
  button:hover { filter: brightness(1.08); }
  .error { margin: 0; font-size: 13px; color: var(--danger); }
</style>
</head>
<body>
<form method="post" action="/{{.AuthPath}}" autocomplete="on">
  <h1>Sign in</h1>
  <label>Login<input name="login" type="text" autocomplete="username" autofocus required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <button type="submit">Continue</button>
</form>
</body>
</html>
