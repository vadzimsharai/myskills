<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Not found</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101215; --fg: #e8e8e8; --muted: #9a9fa6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 40px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p id="msg">Not found</p>
</main>
</body>
</html>
