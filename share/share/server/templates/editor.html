<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Name}} · {{.Title}}</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e6e6e6; --row: #ffffff; --accent: #2457c5; --chip: #eef2fb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --fg: #e8e8e8; --muted: #9a9fa6; --line: #262a30; --row: #16191d; --accent: #7aa2ff; --chip: #1b2333; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
  form { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; font-weight: 600; margin: 0; font-family: var(--mono); }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb a { color: var(--accent); text-decoration: none; }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  button, .btn { font: 13px var(--sans); color: var(--accent); background: var(--chip); border: 1px solid transparent;
           border-radius: 6px; padding: 5px 12px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--accent); }
  .primary { color: #fff; background: var(--accent); }
  textarea { flex: 1; width: 100%; margin: 0; padding: 16px; border: 0; resize: none; outline: none; background: var(--row); color: var(--fg);
             font: 13px/1.5 var(--mono); tab-size: 4; white-space: pre; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<form method="post" action="{{.FolderURL}}?text">
  <header>
    <span class="crumb"><a href="{{.FolderURL}}?files">{{.Title}}</a> /</span>
    <h1>{{.Name}}</h1>
    <input type="hidden" name="name" value="{{.Name}}">
    <div class="actions">
      <span class="hint">Ctrl/⌘+S saves</span>
      <a class="btn" href="{{.FolderURL}}?files">Cancel</a>
      <button type="submit" class="primary">Save</button>
    </div>
  </header>
  <textarea name="content" spellcheck="false" autofocus>{{.Content}}</textarea>
</form>
<script>
(function () {
  var form = document.querySelector('form'), ta = document.querySelector('textarea');
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); form.submit(); }
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); var s = ta.selectionStart; ta.setRangeText('\t', s, ta.selectionEnd, 'end'); }
  });
})();
</script>
</body>
</html>
