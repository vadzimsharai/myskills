# Failed password logins for the protected accounts; users listed in netmon-sshd.local.
[INCLUDES]
before = common.conf

[Definition]
_daemon = sshd
failregex = ^%(__prefix_line)sFailed password for (?:invalid user )?(?:%(protected_users)s) from <HOST> port \d+
ignoreregex =
protected_users = root
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
