# SSH tries for any account except the real ones; root is key-only without keys, so it counts too.
[INCLUDES]
before = common.conf

[Definition]
_daemon = sshd
failregex = ^%(__prefix_line)sInvalid user .* from <HOST> port \d+
            ^%(__prefix_line)sFailed \S+ for (?!(?:%(protected_users)s) from )\S+ from <HOST> port \d+
            ^%(__prefix_line)s(?:Disconnected from|Connection closed by) authenticating user (?!(?:%(protected_users)s) )\S+ <HOST> port \d+ \[preauth\]
ignoreregex =
protected_users = root
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
